# Cloud Build configuration for claude-db-tools
#
# IMPORTANTE: Este serviço é para uso EXCLUSIVO do Claude Code.
# NÃO use em produção. NÃO crie dependências de outros serviços.
#
# Deploy: gcloud builds submit --config=cloudbuild.yaml --project=neqsti

substitutions:
  _VERSION: 'v4'
  _REGION: 'southamerica-east1'
  _REPO: 'lead-gen-judicial'

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:${_VERSION}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:latest'
      - '.'

  # Gate FAIL-CLOSED: a imagem recem-buildada consegue importar o que o server
  # precisa? Sem isto, resolucao de dependencia quebrada so aparece no DEPLOY —
  # foi o que aconteceu em 2026-07-31: `mcp[cli]>=1.0.0` (sem teto) resolveu pra
  # 2.0.0, que tirou o FastMCP de dentro do pacote, e o container morreu no
  # startup probe DEPOIS de ja ter buildado e pushado. Vermelho aqui = nada
  # deploya e a revisao anterior segue servindo.
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:${_VERSION}'
    id: 'smoke-imports'
    entrypoint: python
    # O Dockerfile faz `pip install --user` (pacotes em /root/.local). Em runtime
    # o CMD roda como root e acha; como STEP do Cloud Build o HOME muda e o
    # user-site nao e resolvido -> `No module named 'mcp'` mesmo com o pacote
    # instalado. PYTHONPATH explicito e deterministico (nao depende de HOME).
    env:
      - 'PYTHONPATH=/root/.local/lib/python3.11/site-packages'
    args:
      - '-c'
      - |
        from mcp.server.fastmcp import FastMCP
        from mcp.server.sse import SseServerTransport
        import mcp, psycopg2, uvicorn, starlette
        print(f"smoke OK - mcp {mcp.__version__ if hasattr(mcp,'__version__') else '?'}")

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:${_VERSION}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'claude-db-tools'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:${_VERSION}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      # ⚠️ Estes 4 valores foram afinados IMPERATIVAMENTE no serviço vivo
      # (`gcloud run services update`) e o yaml não sabia — drift medido
      # 2026-07-31: yaml dizia timeout=600 / max=2 / min=0 / concurrency=default(80),
      # o vivo estava em 110 / 5 / 1 / 8. O próximo deploy por este yaml teria
      # REVERTIDO a afinação inteira, em silêncio. Persistido aqui pra não acontecer.
      # `query_timeout` (src/config.py) tem que ficar ABAIXO deste `--timeout`.
      - '--timeout'
      - '110'
      - '--concurrency'
      - '8'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '1'
      - '--network'
      - 'default'
      - '--subnet'
      - 'default'
      - '--vpc-egress'
      - 'private-ranges-only'
      - '--no-allow-unauthenticated'
      - '--set-secrets'
      - 'DB_PASSWORD=CLOUD_SQL_PASSWORD:latest'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:${_VERSION}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/claude-db-tools:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '900s'
